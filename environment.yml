name: pchic
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  # bioinformatics CLI + bindings (conda builds, avoids compiling htslib)
  - bedtools=2.31.1
  - samtools=1.18
  - pysam
  - pybedtools
  - pyfaidx
  - py2bit
  - pybigwig
  - pyvcf3
  - biopython
  - ucsc-bedgraphtobigwig
  - ucsc-bigwigaverageoverbed
  - ucsc-bigwigtobedgraph
  - ucsc-liftover
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - -f https://data.pyg.org/whl/torch-2.5.1+cu121.html
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - torch-geometric==2.8.0.post1
      - torch-scatter==2.1.2+pt25cu121
      - torch-sparse==0.6.18+pt25cu121
      - numpy==2.2.6
      - scipy==1.15.3
      - pandas==2.3.3
      - polars==1.43.2
      - pyarrow==25.0.0
      - scikit-learn==1.7.2
      - statsmodels==0.14.6
      - numba==0.66.0
      - networkx==3.4.2
      - shap==0.49.1
      - umap-learn==0.5.12
      - matplotlib==3.10.9
      - seaborn==0.13.2
      - gtfparse==2.8.0
      - hic-straw==1.3.1
      - pyliftover==0.4.1
      - pyyaml
      - tqdm
      - jupyterlab
      - ipykernel
      - ipywidgets
